{{ define "head" }}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="{{ .MetaDescription }}">
<meta name="theme-color" content="#f6f8f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Food Weight">
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<script src="/assets/theme.js"></script>
<link rel="preload" href="/assets/libre-baskerville-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/app.css">
<script src="/assets/shell.js" defer></script>
<title>{{ .Title }} · Food Weight</title>
{{ end }}

{{ define "brand" }}
<a class="brand" href="/?lang={{ .Language }}" aria-label="Food Weight">
    <svg class="brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M7 12h18l-2 15H9L7 12Z" stroke="currentColor" stroke-width="2"/><path d="M11 12a5 5 0 0 1 10 0M16 7v4M12 19h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <span>food<span class="brand-light">weight</span><span class="brand-dot">.</span></span>
</a>
{{ end }}

{{ define "preferences" }}
<div class="preferences">
    <fieldset class="segments theme-picker" aria-label="{{ .UI.ThemeLabel }}">
        <legend class="sr-only">{{ .UI.ThemeLabel }}</legend>
        <label title="{{ .UI.Light }}"><input type="radio" name="theme" value="light"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg><span class="sr-only">{{ .UI.Light }}</span></span></label>
        <label title="{{ .UI.Dark }}"><input type="radio" name="theme" value="dark"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M20 15.5A9 9 0 0 1 8.5 4 9 9 0 1 0 20 15.5Z"/></svg><span class="sr-only">{{ .UI.Dark }}</span></span></label>
        <label title="{{ .UI.System }}"><input type="radio" name="theme" value="system" checked><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></svg><span class="sr-only">{{ .UI.System }}</span></span></label>
    </fieldset>
    <label class="language"><span class="sr-only">{{ .UI.LanguageLabel }}</span><select id="language" aria-label="{{ .UI.LanguageLabel }}"><option value="en" {{if eq .Language "en"}}selected{{end}}>EN</option><option value="it" {{if eq .Language "it"}}selected{{end}}>IT</option></select></label>
</div>
{{ end }}
